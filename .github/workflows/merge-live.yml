name: Merge Live Sources

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge sources
        run: |
          mkdir -p output
          : > output/live.txt

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Fetching: $url"
            curl -fsSL --retry 3 "$url" | tr -d '\r' >> output/live.txt || echo "Failed: $url" >&2
            echo >> output/live.txt
          done < sources.txt

          awk 'NF && !seen[$0]++' output/live.txt > output/live.clean.txt
          mv output/live.clean.txt output/live.txt

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/live.txt
          git diff --cached --quiet || git commit -m "Update merged live sources"
          git push
