name: Merge Live Sources

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          : > output/live.txt

          while IFS= read -r url; do
            url="${url%$'\r'}"
            [ -z "$url" ] && continue
            echo "Fetching: $url"

            if ! curl -fsSL --retry 3 --connect-timeout 15 "$url" \
              | tr -d '\r' >> output/live.txt; then
              echo "Failed: $url" >&2
            fi
            echo >> output/live.txt
          done < sources.txt

          awk 'NF && !seen[$0]++' output/live.txt > output/live.clean.txt
          mv output/live.clean.txt output/live.txt

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/live.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update merged live sources"
            git push
          else
            echo "No live source changes"
          fi
